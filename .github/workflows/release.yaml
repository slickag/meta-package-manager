---
name: Build & release
"on":
  # Target are chosen so that all commits get a chance to have their build tested.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:

  release:
    uses: slickag/mpm-workflows/.github/workflows/release.yaml@main
    # secrets:
    #   PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    with:
      timeout: 300
